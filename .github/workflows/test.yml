# 自動テスト。練習用 Firebase（エミュレーター）だけを使い、本物の Firebase には触らない。
name: テスト

on:
  push:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
            functions/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: 練習用 Firebase の部品をキャッシュ
        uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: 型チェック・画面とサーバーのテスト・ルールのテスト
        run: npm test
      - name: スマホの大きさで画面を動かすテスト
        run: npm run test:e2e
      - name: 失敗したときの画面を残す
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results
          retention-days: 7
